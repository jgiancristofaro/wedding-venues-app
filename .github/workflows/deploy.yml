name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - name: Build
        env:
          # Served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          OVERRIDE_URL: ${{ vars.VITE_SUPABASE_URL }}
          OVERRIDE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        # Supabase settings come from .env.production; repo variables override them only when set.
        run: |
          if [ -n "$OVERRIDE_URL" ]; then export VITE_SUPABASE_URL="$OVERRIDE_URL"; fi
          if [ -n "$OVERRIDE_KEY" ]; then export VITE_SUPABASE_ANON_KEY="$OVERRIDE_KEY"; fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
