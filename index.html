<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F3" />
    <meta
      name="description"
      content="Vellum — a private wedding venue library that turns every venue's pricing into an apples-to-apples all-in estimate."
    />
    <title>Vellum · Wedding venue research</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('vellum:theme') || '"system"');
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
